[tool.compwa.policy]
package-manager = "none"
repo-name = ".github"
repo-title = "Public ComPWA GitHub profile"

[tool.compwa.policy.github]
no-cd = true
no-pypi = true

[tool.compwa.policy.repo]
keep-issue-templates = true

[tool.tomlsort]
all = false
ignore_case = true
in_place = true
spaces_indent_inline_array = 4
trailing_comma_inline_array = true
